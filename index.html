<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario CRM Externo</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      .button-group {
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Formulario CRM Externo</h2>

    <label for="Empleado_Id">ID del Empleado</label>
    <input type="text" id="Empleado_Id" name="Empleado_Id" />

    <label for="Nombre">Nombre</label>
    <input type="text" id="Nombre" name="Nombre" />

    <label for="Id">ID Interno</label>
    <input type="text" id="Id" name="Id" />

    <label for="idcaso">ID del Caso</label>
    <input type="text" id="idcaso" name="idcaso" />

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" name="descripcion" rows="4"></textarea>

    <div class="button-group">
      <button onclick="guardarYCerrar()">Salvar y cerrar</button>
      <button onclick="cerrar()">Cerrar</button>
    </div>

    <script>
      function obtenerParametros() {
        const params = new URLSearchParams(window.location.search);
        document.getElementById("Empleado_Id").value =
          params.get("Empleado_Id") || "";
        document.getElementById("Nombre").value = params.get("Nombre") || "";
        document.getElementById("Id").value = params.get("Id") || "";
        document.getElementById("idcaso").value = params.get("idcaso") || "";
        document.getElementById("descripcion").value =
          params.get("descripcion") || "";
      }

      function guardarYCerrar() {
        const datos = {
          Empleado_Id: document.getElementById("Empleado_Id").value,
          Nombre: document.getElementById("Nombre").value,
          Id: document.getElementById("Id").value,
          idcaso: document.getElementById("idcaso").value,
          descripcion: document.getElementById("descripcion").value,
        };

        console.log("Datos guardados:", datos);

        try {
          window.parent.postMessage(
            {
              action: "closeInteraction",
              interactionId: datos.idcaso || "sin_id",
            },
            "*"
          );

          Swal.fire({
            icon: "success",
            title: "Interacción cerrada",
            text: "Se notificó correctamente a uContact.",
            timer: 2000,
            showConfirmButton: false,
          }).then(() => {
            location.reload(); // Recargar el formulario para esperar nuevo llamado
          });
        } catch (error) {
          console.error("Error al enviar postMessage:", error);
          Swal.fire({
            icon: "error",
            title: "Error",
            text: "No se pudo cerrar la interacción.",
          });
        }
      }

      function cerrar() {
        try {
          window.parent.postMessage(
            {
              action: "closeInteraction",
              interactionId:
                document.getElementById("idcaso").value || "sin_id",
            },
            "*"
          );

          Swal.fire({
            icon: "info",
            title: "Formulario cerrado",
            text: "Se notificó el cierre sin guardar.",
            timer: 1500,
            showConfirmButton: false,
          }).then(() => {
            location.reload(); // Recargar el formulario para esperar nuevo llamado
          });
        } catch (error) {
          console.error("Error al cerrar:", error);
        }
      }

      window.onload = obtenerParametros;
    </script>
  </body>
</html>
